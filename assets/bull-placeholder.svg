  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8e0cf" />
      <stop offset="1" stop-color="#c9d1bb" />
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#background)" />
  <circle cx="1020" cy="130" r="230" fill="none" stroke="#ad694c" stroke-opacity=".35" stroke-width="70" />
  <circle cx="140" cy="720" r="180" fill="#70402f" fill-opacity=".12" />
  <g transform="translate(600 350)" fill="none" stroke="#70402f" stroke-linecap="round" stroke-linejoin="round" stroke-width="24">
    <rect x="-165" y="-125" width="330" height="250" rx="28" />
