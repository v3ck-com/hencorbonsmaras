<!doctype html>
<html lang="af">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Hencor Bonsmaras se beesveilingskatalogus en lotinligting."
    />
    <title>Hencor Bonsmaras | Veilingskatalogus</title>
    <style>
      :root {
        --ink: #35251f;
        --oxblood: #70402f;
        --clay: #ad694c;
        --sage: #9baa88;
        --sage-dark: #66755a;
        --sand: #d8c8a7;
        --cream: #f4efe5;
        --paper: #fbf8f1;
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        overflow-x: hidden;
        color: var(--ink);
        background:
          radial-gradient(circle at 8% 5%, rgb(255 255 255 / 75%), transparent 28rem),
          radial-gradient(circle at 95% 35%, rgb(112 64 47 / 16%), transparent 35rem),
          linear-gradient(145deg, #e3e7d8 0%, #d9cfb6 52%, #c69577 100%);
        background-attachment: fixed;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      img {
        max-width: 100%;
      }

      .site-header {
        position: relative;
        overflow: hidden;
        color: var(--paper);
        background:
          linear-gradient(90deg, rgb(53 37 31 / 97%), rgb(86 52 42 / 88%)),
          url("assets/LAR210022.jpeg") center 42% / cover;
      }

      .site-header::after {
        position: absolute;
        right: -8vw;
        bottom: -10rem;
        width: min(42rem, 65vw);
        height: 16rem;
        content: "";
        border: 3rem solid rgb(155 170 136 / 30%);
        border-radius: 50%;
        transform: rotate(-8deg);
      }

      .header-inner,
      .catalogue {
        width: min(92rem, 100%);
        margin-inline: auto;
      }

      .header-inner {
        position: relative;
        z-index: 1;
        padding: clamp(4rem, 8vw, 7rem) clamp(1.25rem, 5vw, 5rem) clamp(5rem, 9vw, 7rem);
      }

      .hero-lockup {
        display: grid;
        grid-template-columns: clamp(13rem, 20vw, 17rem) minmax(0, 1fr);
        align-items: center;
        gap: clamp(2.5rem, 6vw, 6rem);
      }

      .brand-mark {
        position: relative;
        width: 100%;
        aspect-ratio: 1;
        overflow: hidden;
        border: 1px solid rgb(255 255 255 / 24%);
        border-radius: clamp(1.75rem, 3vw, 2.75rem);
        background: rgb(248 244 235 / 95%);
        box-shadow:
          0 1.5rem 4rem rgb(20 12 9 / 28%),
          0 0 0 0.65rem rgb(155 170 136 / 13%);
      }

      .brand-mark img {
        position: absolute;
        top: 50%;
        left: 50%;
        display: block;
        width: 133%;
        max-width: none;
        height: auto;
        transform: translate(-50%, -50%);
      }

      .hero-copy {
        padding-left: clamp(2rem, 4vw, 4rem);
        border-left: 1px solid rgb(244 239 229 / 28%);
      }

      .eyebrow {
        margin: 0 0 1rem;
        color: #cbd5bb;
        font-size: 0.78rem;
        font-weight: 800;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }

      h1,
      h2,
      h3,
      p {
        margin-top: 0;
      }

      h1 {
        max-width: 12ch;
        margin-bottom: 1.25rem;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(2.8rem, 7vw, 6.7rem);
        font-weight: 500;
        line-height: 0.92;
        letter-spacing: -0.045em;
      }

      .header-copy {
        max-width: 42rem;
        margin-bottom: 0;
        color: #e4d8c5;
        font-size: clamp(1rem, 2vw, 1.2rem);
        line-height: 1.7;
      }

      .catalogue {
        position: relative;
        z-index: 1;
        padding: clamp(2.5rem, 6vw, 6rem) clamp(1rem, 3vw, 2rem);
      }

      .catalogue-heading {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 2rem;
        margin-bottom: 2rem;
      }

      .catalogue-heading h2 {
        margin-bottom: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(2rem, 4vw, 3.5rem);
        font-weight: 500;
        letter-spacing: -0.035em;
      }

      .lot-count {
        flex: 0 0 auto;
        margin: 0;
        padding-bottom: 0.35rem;
        color: #5f554c;
        font-size: 0.82rem;
        font-weight: 800;
        letter-spacing: 0.13em;
        text-transform: uppercase;
      }

      .lot-card {
        width: 100%;
        min-width: 0;
        overflow: hidden;
        border: 1px solid rgb(53 37 31 / 12%);
        border-radius: 2.5rem;
        background: rgb(251 248 241 / 92%);
        box-shadow: 0 2rem 5rem rgb(53 37 31 / 18%);
        backdrop-filter: blur(12px);
      }

      .lot-card + .lot-card {
        margin-top: clamp(2rem, 5vw, 4rem);
      }

      .lot-overview {
        display: grid;
        grid-template-columns: minmax(0, 1.2fr) minmax(20rem, 0.8fr);
        gap: clamp(2rem, 5vw, 5rem);
        align-items: center;
        padding: clamp(1rem, 4vw, 3.5rem);
      }

      .lot-overview > * {
        min-width: 0;
      }

      .pasture-frame {
        position: relative;
        overflow: hidden;
        padding: clamp(0.65rem, 1.3vw, 1rem);
        border: 1px solid #67534a;
        border-radius: 2.25rem;
        background: var(--ink);
        box-shadow: 0 1.5rem 3.5rem rgb(53 37 31 / 30%);
      }

      .pasture-frame::before {
        position: absolute;
        top: -4.5rem;
        right: -4rem;
        width: 11rem;
        height: 11rem;
        content: "";
        border: 1.5rem solid rgb(155 170 136 / 75%);
        border-radius: 50%;
      }

      .pasture-frame::after {
        position: absolute;
        bottom: -4rem;
        left: -3rem;
        width: 9rem;
        height: 9rem;
        content: "";
        border-radius: 50%;
        background: rgb(173 105 76 / 85%);
      }

      .pasture-frame-inner {
        position: relative;
        z-index: 1;
        padding: 0.4rem;
        border-radius: 1.65rem;
        background: var(--sand);
      }

      .pasture-frame img {
        display: block;
        width: 100%;
        aspect-ratio: 3 / 2;
        object-fit: cover;
        border: 1px solid rgb(53 37 31 / 30%);
        border-radius: 1.3rem;
      }

      .lot-label {
        display: inline-flex;
        align-items: center;
        min-height: 2.5rem;
        margin-bottom: 1.5rem;
        padding: 0.65rem 1rem;
        border-radius: 999px;
        color: var(--paper);
        background: var(--oxblood);
        font-size: 0.78rem;
        font-weight: 900;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .lot-details h3 {
        margin-bottom: 0.65rem;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(2.2rem, 5vw, 4.4rem);
        font-weight: 500;
        line-height: 1;
        letter-spacing: -0.04em;
      }

      .bull-number {
        margin-bottom: 2rem;
        color: var(--sage-dark);
        font-size: 1rem;
        font-weight: 850;
        letter-spacing: 0.13em;
        text-transform: uppercase;
      }

      .lot-description {
        max-width: 36rem;
        margin-bottom: 2rem;
        color: #655a51;
        font-size: 1rem;
        line-height: 1.75;
      }

      .video-link {
        display: inline-flex;
        align-items: center;
        gap: 0.65rem;
        min-height: 3.2rem;
        padding: 0.8rem 1.25rem;
        border-radius: 999px;
        color: white;
        background: var(--clay);
        font-size: 0.88rem;
        font-weight: 850;
        text-decoration: none;
      }

      .video-link svg {
        width: 1.15rem;
        height: 1.15rem;
        fill: currentColor;
      }

      .video-link.pending {
        cursor: not-allowed;
        color: #766a60;
        background: #ded6c7;
      }

      .figures-section {
        min-width: 0;
        padding: clamp(1.25rem, 4vw, 3.5rem);
        border-top: 1px solid rgb(53 37 31 / 12%);
        background: #eee7d8;
      }

      .figures-heading {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 2rem;
        margin-bottom: 1rem;
      }

      .figures-heading h3 {
        margin-bottom: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(1.5rem, 3vw, 2.2rem);
        font-weight: 500;
      }

      .figures-heading p {
        margin-bottom: 0.2rem;
        color: #6d6258;
        font-size: 0.82rem;
      }

      .figures-viewport {
        width: 100%;
        min-width: 0;
        overflow-x: auto;
        border: 1px solid rgb(53 37 31 / 18%);
        border-radius: 1rem;
        background: white;
        box-shadow: 0 0.8rem 2rem rgb(53 37 31 / 10%);
        scrollbar-color: var(--sage-dark) transparent;
      }

      .figures-viewport a,
      .figures-viewport img {
        display: block;
      }

      .figures-viewport img {
        width: 100%;
        min-width: 62rem;
        height: auto;
      }

      .site-footer {
        padding: 2rem 1.25rem 3rem;
        color: #51463e;
        text-align: center;
        font-size: 0.8rem;
        font-weight: 750;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      @media (max-width: 800px) {
        .header-inner {
          padding-block: 3rem 4.5rem;
        }

        .hero-lockup {
          grid-template-columns: 1fr;
          gap: 2.5rem;
        }

        .brand-mark {
          width: min(13rem, 65vw);
        }

        .hero-copy {
          padding-left: 0;
          border-left: 0;
        }

        .catalogue-heading,
        .figures-heading {
          display: block;
        }

        .lot-count,
        .figures-heading p {
          margin-top: 0.65rem;
        }

        .lot-overview {
          grid-template-columns: 1fr;
        }

        .lot-card {
          border-radius: 1.75rem;
        }

        .figures-viewport img {
          min-width: 52rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto;
        }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <div class="hero-lockup">
          <div class="brand-mark">
            <img src="assets/logo.svg" alt="Hencor Bonsmaras" />
          </div>
          <div class="hero-copy">
            <p class="eyebrow">Hencor Bonsmaras</p>
            <h1>Veilingskatalogus</h1>
            <p class="header-copy">
              Verken elke bul wat aangebied word, kyk na beskikbare lotvideo's en bestudeer stamboom- en teelsyfers voor die veilingsdag.
            </p>
          </div>
        </div>
      </div>
    </header>

    <main class="catalogue">
      <div class="catalogue-heading">
        <div>
          <p class="eyebrow" style="color: var(--oxblood)">Bulle op aanbod</p>
          <h2>Veilingslotte</h2>
        </div>
        <p class="lot-count">25 lotte gelys</p>
      </div>

      <div id="lot-list"></div>
      <noscript>JavaScript moet geaktiveer wees om die veilingslotte te vertoon.</noscript>
    </main>

    <footer class="site-footer">Hencor Bonsmaras Veilingskatalogus</footer>
    <script>
      const bulls = [
        "HC240019",
        "HC240003",
        "HC240145",
        "HC240079",
        "HC240005",
        "HC240007",
        "HC230057 HH",
        "HC230075",
        "HC240109",
        "HC240029",
        "HC240035",
        "HC240051",
        "HC240137",
        "HC240101",
        "HC240123",
        "HC240011",
        "HC240023",
        "HC240061",
        "HC240083",
        "HC240025",
        "HC240139",
        "HC240087",
        "HC240133",
        "HC240067",
        "HC240085",
      ];

      document.querySelector("#lot-list").innerHTML = bulls
        .map((bull, index) => {
          const lot = String(index + 1).padStart(2, "0");

          return `
            <article class="lot-card" id="lot-${lot}">
              <div class="lot-overview">
                <div class="pasture-frame">
                  <div class="pasture-frame-inner">
                    <img
                      src="assets/bull-placeholder.svg"
                      alt="Plekhouer vir die bulfoto van lot ${lot}, ${bull}"
                      loading="lazy"
                      decoding="async"
                    />
                  </div>
                </div>

                <div class="lot-details">
                  <span class="lot-label">Lot ${lot}</span>
                  <h3>Hencor Bonsmaras</h3>
                  <p class="bull-number">${bull}</p>
                  <p class="lot-description">
                    Bestudeer die volledige stamboom, teelwaardes, groeisyfers en karkasaanwysers vir hierdie lot hieronder.
                  </p>
                  <span class="video-link pending" aria-disabled="true">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                      <path d="M8 5v14l11-7z" />
                    </svg>
                    Video binnekort beskikbaar
                  </span>
                </div>
              </div>

              <section class="figures-section" aria-labelledby="lot-${lot}-figures">
                <div class="figures-heading">
                  <h3 id="lot-${lot}-figures">Stamboom &amp; syfers</h3>
                  <p>Rol horisontaal op kleiner skerms. Kies die beeld om dit volgrootte te besigtig.</p>
                </div>
                <div class="figures-viewport">
                  <a href="assets/katalogus-tables/lot-${lot}.png" target="_blank" rel="noopener">
                    <img
                      src="assets/katalogus-tables/lot-${lot}.png"
                      alt="Stamboom en teelsyfers vir lot ${lot}, ${bull}"
                      loading="lazy"
                      decoding="async"
                    />
                  </a>
                </div>
              </section>
            </article>`;
        })
        .join("");
    </script>
  </body>
</html>
